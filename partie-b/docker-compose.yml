services:
  db:
    image: redis:7-alpine
    container_name: db-service
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
    environment:
      REDIS_HOST: db-service
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:5000"
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  redis-data:
    name: redis-data
